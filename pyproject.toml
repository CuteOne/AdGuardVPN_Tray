[project]
name = "adguardvpn-tray"
version = "0.1.0"
description = "KDE Plasma system tray application for managing AdGuard VPN via adguardvpn-cli"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6",
    "pexpect",
]

[project.scripts]
adguardvpn-tray = "adguardvpn_tray.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adguardvpn_tray = ["resources/icons/*.png"]
